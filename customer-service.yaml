spring:
 jpa:
   properties:
     hibernate:
       format_sql: true
 flyway:
   enabled: true
   locations: classpath:db/migration
 security:
   oauth2:
     resourceserver:
       jwt:
         issuer-uri: https://integrator-8708369.okta.com/oauth2/default
eureka:
 client:
   service-url:
     defaultZone: http://localhost:8761/eureka/
 instance:
   prefer-ip-address: true
management:
 endpoints:
   web:
     exposure:
       include: "*"
 endpoint:
   health:
     show-details: always
   env:
     show-values: ALWAYS
