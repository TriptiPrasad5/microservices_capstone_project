spring:
 jpa:
   properties:
     hibernate:
       format_sql: false
 flyway:
   enabled: true
   locations: classpath:db/migration
 security:
   oauth2:
     resourceserver:
       jwt:
         issuer-uri: https://integrator-8708369.okta.com/oauth2/default
resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 2s
eureka:
 client:
   service-url:
     defaultZone: http://localhost:8761/eureka/
 instance:
   prefer-ip-address: true
management:
 endpoints:
   web:
     exposure:
       include: "*"
 endpoint:
   health:
     show-details: always
   env:
     show-values: ALWAYS
